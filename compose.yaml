services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - stock-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      ConnectionStrings__Stock: Host=db;Database=stock;Username=stock;Password=stock_dev
      FrontendOrigin: http://localhost:3000
    ports: ["127.0.0.1:5000:8080"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  stock-data:
